<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173c30">
<title>Моя копилка</title>
<style>
  :root { color-scheme: light; --green:#173c30; --green2:#285b46; --mint:#d4f4b5; --bg:#f4f6f1; --card:#fff; --muted:#65756c; --border:#e1e8e1; --red:#b54747; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#17251e; font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .app { max-width:680px; margin:0 auto; padding:18px 14px 36px; }
  .hero { background:var(--green); color:white; border-radius:24px; padding:24px; box-shadow:0 10px 30px #173c301c; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:46px; height:46px; display:grid; place-items:center; background:var(--mint); color:var(--green); border-radius:15px; font-size:25px; }
  h1 { font-size:24px; margin:0; letter-spacing:-.5px; }
  .tagline { color:#d4e7da; font-size:13px; margin-top:2px; }
  .eyebrow { color:#d4e7da; margin:26px 0 2px; font-size:14px; }
  .balance { font-size:clamp(32px,8vw,44px); font-weight:750; letter-spacing:-1.5px; overflow-wrap:anywhere; }
  .goal-row { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-top:20px; color:#d4e7da; font-size:14px; }
  .percent { color:var(--mint); font-weight:750; font-size:18px; }
  .track { background:#416353; height:10px; border-radius:99px; overflow:hidden; margin:9px 0; }
  .fill { height:100%; width:0; background:var(--mint); border-radius:99px; transition:width .2s; }
  .remaining { color:#d4e7da; font-size:13px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:19px; margin-top:14px; box-shadow:0 4px 16px #17251e08; }
  h2 { font-size:18px; margin:0 0 14px; }
  label { display:block; font-size:13px; font-weight:650; margin-bottom:6px; color:#42564a; }
  input, select { width:100%; min-height:45px; border:1px solid #ccd8ce; border-radius:11px; padding:10px 12px; background:#fff; color:#17251e; font:inherit; }
  input:focus,select:focus,button:focus-visible { outline:3px solid #a9d7a1; outline-offset:2px; }
  .field { margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { border:0; border-radius:11px; min-height:44px; padding:10px 14px; font:650 14px/1.3 inherit; cursor:pointer; }
  .primary { background:var(--green); color:white; }
  .secondary { background:#edf2ed; color:var(--green); border:1px solid #dce5dc; }
  .small { min-height:34px; padding:6px 10px; font-size:12px; }
  .notice { background:#edf5e9; color:#244b31; padding:10px 12px; border-radius:10px; margin-top:12px; font-size:13px; }
  .notice.error { background:#fff0ef; color:#8a3030; }
  .history { display:grid; gap:10px; }
  .transaction { display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid #edf0ed; }
  .transaction:last-child { border-bottom:0; }
  .tx-icon { width:38px; height:38px; flex:0 0 38px; border-radius:50%; background:#edf4ed; display:grid; place-items:center; font-size:19px; }
  .tx-main { flex:1; min-width:0; }
  .tx-name { font-weight:650; overflow-wrap:anywhere; }
  .tx-date { font-size:12px; color:var(--muted); }
  .tx-amount { font-weight:750; white-space:nowrap; }
  .income { color:#267246; } .expense { color:var(--red); }
  .empty { color:var(--muted); text-align:center; padding:16px 6px; font-size:14px; }
  .footer { color:var(--muted); text-align:center; font-size:12px; padding:18px 8px 0; }
  @media (max-width:420px) { .hero{padding:20px}.panel{padding:15px}.grid{gap:8px} }
</style>
</head>
<body>
<main class="app">
  <header class="hero">
    <div class="brand"><div class="logo" aria-hidden="true">🐷</div><div><h1>Моя копилка</h1><div class="tagline">Маленькие шаги к большой цели</div></div></div>
    <div class="eyebrow">Всего накоплено</div>
    <div class="balance" id="balance" aria-live="polite">$250.00</div>
    <div class="goal-row"><span id="goalLabel">Цель: $1,000.00</span><span class="percent" id="percent">25%</span></div>
    <div class="track" aria-label="Прогресс накоплений"><div class="fill" id="progress"></div></div>
    <div class="remaining" id="remaining">Осталось накопить $750.00</div>
  </header>

  <section class="panel">
    <h2>Моя цель</h2>
    <div class="grid">
      <div class="field"><label for="goalInput">Сколько хочу накопить</label><input id="goalInput" type="number" min="0.01" step="0.01" value="1000"></div>
      <div class="field"><label for="currency">Валюта</label><select id="currency"><option value="USD">USD — доллар</option><option value="EUR">EUR — евро</option><option value="RUB">RUB — рубль</option><option value="GBP">GBP — фунт</option><option value="PLN">PLN — злотый</option></select></div>
    </div>
    <button class="primary" id="saveGoal">Сохранить цель</button>
    <div id="goalNotice" class="notice" role="status" hidden></div>
  </section>

  <section class="panel">
    <h2>Движение денег</h2>
    <div class="field"><label for="amount">Сумма</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="Например, 50" inputmode="decimal"></div>
    <div class="field"><label for="description">Комментарий (необязательно)</label><input id="description" maxlength="80" placeholder="Например, отложил с зарплаты"></div>
    <div class="grid"><button class="primary" id="addMoney">＋ Пополнить</button><button class="secondary" id="takeMoney">− Снять</button></div>
    <div id="moneyNotice" class="notice" role="status" hidden></div>
  </section>

  <section class="panel">
    <h2>История операций</h2>
    <div class="history" id="history"></div>
    <button class="secondary small" id="clearHistory" style="margin-top:10px">Очистить историю и начать заново</button>
    <div id="resetNotice" class="notice" role="status" hidden></div>
  </section>
  <p class="footer">Учебное приложение. Данные хранятся только в этом браузере на этом устройстве. Это не банковский счёт и не переводит реальные деньги.</p>
</main>
<script>
(() => {
  const STORAGE_KEY = "my-piggy-bank-v1";
  const defaults = {
    balance: 250,
    goal: 1000,
    currency: "USD",
    transactions: [{ id: 1, type: "in", amount: 250, description: "Начальные накопления", date: new Date().toISOString() }]
  };
  let state = loadState();

  const $ = id => document.getElementById(id);
  const formatMoney = amount => {
    try { return new Intl.NumberFormat("ru-RU", { style: "currency", currency: state.currency, maximumFractionDigits: 2 }).format(amount); }
    catch { return `${amount.toFixed(2)} ${state.currency}`; }
  };
  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return structuredClone(defaults);
      const parsed = JSON.parse(saved);
      if (typeof parsed.balance !== "number" || !Number.isFinite(parsed.balance) ||
          typeof parsed.goal !== "number" || !Number.isFinite(parsed.goal) ||
          !Array.isArray(parsed.transactions)) return structuredClone(defaults);
      return { ...defaults, ...parsed, transactions: parsed.transactions };
    } catch (error) {
      console.warn("Не удалось загрузить сохранённые данные:", error);
      return structuredClone(defaults);
    }
  }
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (error) {
      console.error("Не удалось сохранить данные:", error);
      showNotice("moneyNotice", "Не удалось сохранить данные. Возможно, браузер запрещает хранение для локального файла.", true);
      return false;
    }
  }
  function showNotice(id, message, isError = false) {
    const el = $(id); el.textContent = message; el.hidden = false;
    el.classList.toggle("error", isError);
  }
  function render() {
    $("balance").textContent = formatMoney(state.balance);
    $("goalLabel").textContent = `Цель: ${formatMoney(state.goal)}`;
    const ratio = state.goal > 0 ? Math.min(100, state.balance / state.goal * 100) : 0;
    $("percent").textContent = `${Math.round(ratio)}%`;
    $("progress").style.width = `${ratio}%`;
    $("remaining").textContent = state.goal <= 0 ? "Укажи цель больше нуля" :
      state.balance >= state.goal ? "🎉 Цель достигнута! Отличная работа!" : `Осталось накопить ${formatMoney(state.goal - state.balance)}`;
    $("goalInput").value = state.goal;
    $("currency").value = state.currency;
    renderHistory();
  }
  function renderHistory() {
    const root = $("history"); root.replaceChildren();
    if (!state.transactions.length) {
      const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "Пока нет операций. Добавь первое пополнение!";
      root.append(empty); return;
    }
    state.transactions.slice().sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(tx => {
      const row = document.createElement("div"); row.className = "transaction";
      const icon = document.createElement("div"); icon.className = "tx-icon"; icon.textContent = tx.type === "in" ? "↙" : "↗";
      const main = document.createElement("div"); main.className = "tx-main";
      const name = document.createElement("div"); name.className = "tx-name"; name.textContent = tx.description || (tx.type === "in" ? "Пополнение" : "Снятие");
      const date = document.createElement("div"); date.className = "tx-date";
      const parsedDate = new Date(tx.date); date.textContent = Number.isNaN(parsedDate.getTime()) ? "" : parsedDate.toLocaleString("ru-RU");
      main.append(name, date);
      const amount = document.createElement("div"); amount.className = `tx-amount ${tx.type === "in" ? "income" : "expense"}`;
      amount.textContent = `${tx.type === "in" ? "+" : "−"}${formatMoney(tx.amount)}`;
      row.append(icon, main, amount); root.append(row);
    });
  }
  function validAmount() {
    const raw = $("amount").value;
    const n = Number(raw);
    if (!raw.trim() || !Number.isFinite(n) || n <= 0) { showNotice("moneyNotice", "Введи сумму больше нуля.", true); return null; }
    if (!Number.isFinite(Math.round(n * 100) / 100)) { showNotice("moneyNotice", "Проверь сумму.", true); return null; }
    return Math.round(n * 100) / 100;
  }
  function transact(type) {
    const amount = validAmount(); if (amount === null) return;
    if (type === "out" && amount > state.balance) { showNotice("moneyNotice", "Недостаточно денег в копилке.", true); return; }
    state.balance = Math.round((state.balance + (type === "in" ? amount : -amount)) * 100) / 100;
    const description = $("description").value.trim() || (type === "in" ? "Пополнение" : "Снятие");
    state.transactions.push({ id: Date.now() + Math.random(), type, amount, description, date: new Date().toISOString() });
    saveState(); render();
    $("amount").value = ""; $("description").value = "";
    showNotice("moneyNotice", type === "in" ? "Пополнение сохранено!" : "Снятие сохранено.");
  }
  $("addMoney").addEventListener("click", () => transact("in"));
  $("takeMoney").addEventListener("click", () => transact("out"));
  $("saveGoal").addEventListener("click", () => {
    const n = Number($("goalInput").value);
    if (!$("goalInput").value.trim() || !Number.isFinite(n) || n <= 0) { showNotice("goalNotice", "Цель должна быть больше нуля.", true); return; }
    state.goal = Math.round(n * 100) / 100; state.currency = $("currency").value;
    saveState(); render(); showNotice("goalNotice", "Цель и валюта сохранены.");
  });
  $("clearHistory").addEventListener("click", () => {
    if (!confirm("Сбросить баланс, цель и всю историю операций? Это действие нельзя отменить.")) return;
    state = { ...structuredClone(defaults), transactions: [{ id: Date.now(), type: "in", amount: 250, description: "Начальные накопления", date: new Date().toISOString() }] };
    saveState(); render(); showNotice("resetNotice", "Демо возвращено к начальным значениям.");
    $("moneyNotice").hidden = true; $("goalNotice").hidden = true;
  });
  render();
})();
</script>
</body>
</html>
